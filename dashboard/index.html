<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NIF Platform · fumoca.co.za</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="../../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050508;--bg2:#0c0c12;--bg3:#13131c;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f8;--text2:#8888aa;--text3:#44445a;
  --accent:#7c6dfa;--accent2:#a594ff;
  --gold:#f0c060;--green:#3ddc97;--red:#ff5566;--amber:#ffaa44;
  --font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:10px;--r2:16px;
}
html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{width:4px}
*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer}

/* ── Auth ─────────────────────────────────────────────────────────────────── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.auth-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:0.4}
.auth-glow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:700px;height:400px;background:radial-gradient(ellipse,rgba(124,109,250,0.15) 0%,transparent 70%)}
.auth-card{width:100%;max-width:380px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);padding:32px;position:relative}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo-tag{font-family:var(--mono);font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.auth-logo-name{font-size:28px;font-weight:800;letter-spacing:-0.03em}
.auth-tabs{display:flex;gap:3px;background:var(--bg3);border-radius:8px;padding:3px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;border-radius:6px;border:none;background:transparent;color:var(--text3);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.auth-tab.active{background:var(--bg2);color:var(--text)}

/* ── Layout ───────────────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;height:100vh}
.sidebar-logo{padding:20px;border-bottom:0.5px solid var(--border)}
.sidebar-logo-tag{font-family:var(--mono);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.sidebar-logo-name{font-size:17px;font-weight:800;letter-spacing:-0.02em}
.sidebar-nav{flex:1;padding:10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:none;background:transparent;color:var(--text2);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;width:100%;text-align:left}
.nav-item.active{background:rgba(124,109,250,0.1);color:var(--accent2);font-weight:600}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--text)}
.nav-icon{font-size:14px;width:16px;text-align:center;opacity:0.7;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;background:var(--amber);color:#000;border-radius:999px;padding:1px 6px;font-weight:700}
.sidebar-user{padding:12px;border-top:0.5px solid var(--border)}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg3)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-email{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-plan{font-size:10px;color:var(--text3)}
.sign-out-btn{background:none;border:none;color:var(--text3);font-size:15px;padding:2px;transition:color 0.15s}
.sign-out-btn:hover{color:var(--text)}
.main{flex:1;overflow-y:auto}

/* ── Shared components ────────────────────────────────────────────────────── */
.page{padding:32px 40px;max-width:1080px;margin:0 auto}
.page-header{margin-bottom:28px}
.page-tag{font-family:var(--mono);font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text2)}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r2);transition:border-color 0.15s}
.card.hover:hover{border-color:var(--border2)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--r);font-family:var(--font);font-size:13px;font-weight:600;border:none;transition:all 0.15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;border:0.5px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{border-color:var(--border);color:var(--text)}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{filter:brightness(1.08)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.input{background:var(--bg3);border:0.5px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:var(--r);font-family:var(--font);font-size:13px;outline:none;transition:border-color 0.15s;width:100%}
.input:focus{border-color:var(--accent)}
.select{background:var(--bg3);border:0.5px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:var(--r);font-family:var(--font);font-size:13px;outline:none;width:100%;cursor:pointer}
.label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:6px;display:block}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:0.06em;text-transform:uppercase;display:inline-block}
.field{display:flex;flex-direction:column;gap:6px}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}
.error-msg{font-size:12px;color:var(--red);padding:8px 12px;background:rgba(255,85,102,0.08);border:0.5px solid rgba(255,85,102,0.2);border-radius:var(--r)}
.success-msg{font-size:12px;color:var(--green);padding:8px 12px;background:rgba(61,220,151,0.08);border:0.5px solid rgba(61,220,151,0.2);border-radius:var(--r)}
.empty-state{text-align:center;padding:64px 20px;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.3}
.empty-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.progress-bar-track{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.6s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp 0.35s ease both}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
const SB_URL = (window.NIF_CONFIG?.supabaseUrl) ?? 'https://ijfimuodpvbuwrspzfra.supabase.co';
const SB_KEY = (window.NIF_CONFIG?.supabaseAnonKey) ?? 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqZmltdW9kcHZidXdyc3B6ZnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MzIzNzgsImV4cCI6MjA5MzUwODM3OH0.rqAwagwnh7VxA-j5vrAo14P07N7ZawYZ9pFE85X517c';
const sb     = supabase.createClient(SB_URL, SB_KEY);

const API = (window.NIF_CONFIG?.apiBase) ?? 'http://localhost:3001/api';

// ── State ────────────────────────────────────────────────────────────────────
let state = {
  user:     null,
  token:    null,
  view:     'dashboard',
  files:    [],
  jobs:     [],
  licenses: [],
  loading:  false,
  error:    null,
};

const root = document.getElementById('root');

// ── Supabase auth init ───────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.user  = session.user;
    state.token = session.access_token;
    // Store for viewer/compare/capture pages
    if (session.access_token) sessionStorage.setItem('nif_token', session.access_token);
    await loadAll();
    render();
  } else {
    render();
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    state.user  = session?.user  ?? null;
    state.token = session?.access_token ?? null;
    if (state.user) { await loadAll(); }
    else            { state.files=[]; state.jobs=[]; state.licenses=[]; }
    render();
  });
}

// ── API helpers ───────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${state.token}`, ...(opts.headers??{}) },
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error ?? 'API error');
  return data;
}

async function loadAll() {
  const [files, jobs, licenses] = await Promise.all([
    api('/nif').catch(()=>[]),
    api('/jobs').catch(()=>[]),
    api('/licenses').catch(()=>[]),
  ]);
  state.files    = files;
  state.jobs     = jobs;
  state.licenses = licenses;
}

let realtimeSubscribed = false;
// Realtime: update jobs live
function subscribeRealtime() {
  if (!state.user || realtimeSubscribed) return;
  // Watch reconstruction jobs
  realtimeSubscribed = true;
  sb.channel('jobs-live')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'reconstruction_jobs', filter:`user_id=eq.${state.user.id}` },
      payload => {
        state.jobs = state.jobs.map(j => j.id === payload.new.id ? {...j,...payload.new} : j);
        render();
      }
    ).subscribe();
  // Watch print jobs — update nif file print_r2_keys when complete
  sb.channel('print-jobs-live')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'print_jobs', filter:`user_id=eq.${state.user.id}` },
      async payload => {
        const j = payload.new;
        if (j.status === 'complete') {
          // Reload the nif_file so print_r2_keys reflects new STLs
          const { data } = await sb.from('nif_files').select('*').eq('id', j.nif_id).single();
          if (data) state.files = state.files.map(f => f.id === data.id ? data : f);
        }
        render();
      }
    ).subscribe();
}

// ── Auth screen ───────────────────────────────────────────────────────────────
function renderAuth() {
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-grid"></div>
      <div class="auth-glow"></div>
      <div class="auth-card fade-up">
        <div class="auth-logo">
          <div class="auth-logo-tag">fumoca.co.za</div>
          <div class="auth-logo-name">NIF Platform</div>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-in"  onclick="switchAuthTab('in')">Sign In</button>
          <button class="auth-tab"        id="tab-up"  onclick="switchAuthTab('up')">Sign Up</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px" id="auth-form">
          <div class="field" id="name-field" style="display:none">
            <label class="label">Full name</label>
            <input class="input" id="auth-name" type="text" placeholder="Your name"/>
          </div>
          <div class="field">
            <label class="label">Email</label>
            <input class="input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <div class="field">
            <label class="label">Password</label>
            <input class="input" id="auth-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
          </div>
          <div id="auth-error" style="display:none" class="error-msg"></div>
          <button class="btn btn-primary" id="auth-btn" style="width:100%;justify-content:center;padding:11px" onclick="doAuth()">
            Sign In →
          </button>
        </div>
        <div style="margin-top:20px;text-align:center;font-size:11px;color:var(--text3)">
          © Fumoca Technologies · fumoca.co.za
        </div>
      </div>
    </div>
  `;
  document.getElementById('auth-pass').addEventListener('keydown', e => { if(e.key==='Enter') doAuth(); });
}

let authMode = 'in';
window.switchAuthTab = (mode) => {
  authMode = mode;
  document.getElementById('tab-in').classList.toggle('active', mode==='in');
  document.getElementById('tab-up').classList.toggle('active', mode==='up');
  document.getElementById('name-field').style.display = mode==='up' ? 'flex' : 'none';
  document.getElementById('auth-btn').textContent = mode==='in' ? 'Sign In →' : 'Create Account ✦';
  document.getElementById('auth-pass').autocomplete = mode==='in' ? 'current-password' : 'new-password';
};

window.doAuth = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-pass').value;
  const name  = document.getElementById('auth-name')?.value.trim() ?? '';
  const errEl = document.getElementById('auth-error');
  const btn   = document.getElementById('auth-btn');

  if (!email || !pass) { showAuthError('Email and password required'); return; }
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:14px;height:14px"></div>';
  errEl.style.display = 'none';

  try {
    let result;
    if (authMode === 'in') {
      result = await sb.auth.signInWithPassword({ email, password: pass });
    } else {
      result = await sb.auth.signUp({ email, password: pass, options:{ data:{ full_name: name } } });
    }
    if (result.error) throw result.error;
  } catch(e) {
    btn.disabled = false;
    btn.textContent = authMode==='in' ? 'Sign In →' : 'Create Account ✦';
    showAuthError(e.message);
  }
};

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}

// ── App layout ────────────────────────────────────────────────────────────────
function renderApp() {
  const activeJobs = state.jobs.filter(j => j.status==='queued'||j.status==='processing').length;
  const nav = [
    { id:'dashboard', label:'Dashboard', icon:'◈' },
    { id:'files',     label:'NIF Files', icon:'◉' },
    { id:'upload',    label:'Upload',    icon:'↑'  },
    { id:'jobs',      label:'Jobs',      icon:'⊡', badge: activeJobs||0 },
    { id:'analytics', label:'Analytics', icon:'📊' },
    { id:'delivery',  label:'Deliveries',icon:'📦' },
    { id:'video',     label:'Video Editor', icon:'▶' },
    { id:'print',     label:'3D Print',  icon:'⬡'  },
    { id:'licenses',  label:'Licenses',  icon:'⊛'  },
    { id:'revenue',   label:'Revenue',   icon:'◎'  },
  ];
  const email = state.user?.email ?? '';
  const initials = email[0]?.toUpperCase() ?? '?';

  root.innerHTML = `
    <div class="app">
      <div class="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-tag">fumoca.co.za</div>
          <div class="sidebar-logo-name">NIF ✦</div>
        </div>
        <nav class="sidebar-nav">
          ${nav.map(n => `
            <button class="nav-item${state.view===n.id?' active':''}" onclick="setView('${n.id}')">
              <span class="nav-icon">${n.icon}</span>
              ${n.label}
              ${n.badge ? `<span class="nav-badge">${n.badge}</span>` : ''}
            </button>
          `).join('')}
        </nav>
        <div class="sidebar-user">
          <div class="user-row">
            <div class="user-avatar">${initials}</div>
            <div class="user-info">
              <div class="user-email">${email}</div>
              <div class="user-plan">Free plan</div>
            </div>
            <button class="sign-out-btn" onclick="doSignOut()" title="Sign out">↩</button>
          </div>
        </div>
      </div>
      <main class="main" id="main-content">
        ${renderView()}
      </main>
    </div>
  `;
}

function renderView() {
  switch(state.view) {
    case 'dashboard': return renderDashboard();
    case 'files':     return renderFiles();
    case 'upload':    return renderUpload();
    case 'jobs':      return renderJobs();
    case 'licenses':  return renderLicenses();
    case 'revenue':   return renderRevenue();
    case 'print':     return renderPrint();
    case 'video':     return renderVideoEditor();
    case 'analytics': return renderAnalytics();
    case 'delivery':  return renderDelivery();
    default:          return renderDashboard();
  }
}

window.setView = (v) => { state.view = v; state.error = null; render(); };

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard() {
  const totalViews = state.files.reduce((s,f)=>s+(f.view_count||0),0);
  const activeJobs = state.jobs.filter(j=>j.status==='queued'||j.status==='processing').length;
  const revenue    = state.licenses.filter(l=>l.is_active).reduce((s,l)=>s+parseFloat(l.monthly_fee||0),0);

  return `<div class="page fade-up">
    <div class="page-header">
      <div class="page-tag">Overview</div>
      <div class="page-title">Dashboard</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px">
      ${[
        {label:'NIF Files',       value:state.files.length, color:'var(--accent2)', sub:'total'},
        {label:'Active Jobs',     value:activeJobs,          color:'var(--amber)',   sub:'processing'},
        {label:'Total Views',     value:fmt(totalViews),     color:'var(--green)',   sub:'all files'},
        {label:'Monthly Revenue', value:`R ${revenue.toFixed(0)}`, color:'var(--gold)', sub:'active licenses'},
      ].map(m=>`
        <div class="card" style="padding:20px">
          <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">${m.label}</div>
          <div style="font-size:30px;font-weight:800;color:${m.color};font-family:var(--mono);letter-spacing:-0.02em;margin-bottom:2px">${m.value}</div>
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em">${m.sub}</div>
        </div>
      `).join('')}
    </div>
    ${state.files.length === 0 && state.jobs.length === 0 ? `
      <div class="empty-state" style="padding:80px 20px">
        <div class="empty-icon">✦</div>
        <div class="empty-title">No NIF files yet</div>
        <div style="margin-bottom:20px">Upload your first capture to get started</div>
        <button class="btn btn-primary" onclick="setView('upload')">Upload capture ↑</button>
      </div>
    ` : `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between">
            Recent Files
            <button class="btn btn-ghost" style="padding:4px 10px;font-size:10px" onclick="setView('files')">All →</button>
          </div>
          ${state.files.length === 0
            ? `<div class="card" style="padding:24px;text-align:center;color:var(--text3)">No files yet</div>`
            : state.files.slice(0,5).map(f=>`
              <div class="card" style="padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
                <span style="font-size:18px">${vIcon(f.vertical)}</span>
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.title||'Untitled'}</div>
                  <div style="font-size:11px;color:var(--text2)">${fmtDate(f.created_at)} · ${fmtBytes(f.file_size)}</div>
                </div>
                <span class="badge" style="background:${vColor(f.vertical)}18;color:${vColor(f.vertical)};border:0.5px solid ${vColor(f.vertical)}33">${f.vertical}</span>
              </div>
            `).join('')
          }
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between">
            Jobs
            <button class="btn btn-ghost" style="padding:4px 10px;font-size:10px" onclick="setView('jobs')">All →</button>
          </div>
          ${state.jobs.length === 0
            ? `<div class="card" style="padding:24px;text-align:center;color:var(--text3)">No jobs yet</div>`
            : state.jobs.slice(0,5).map(j => renderJobCard(j)).join('')
          }
        </div>
      </div>
    `}
  </div>`;
}

// ── Files ─────────────────────────────────────────────────────────────────────
// ── AI copy generator — all verticals ────────────────────────────────────────
// Called from every NIF file card. Shows vertical-specific fields.
const AI_COPY_CONFIG = {
  property: {
    title:  '✍ AI Listing Description',
    sub:    'Generates a professional estate agent listing from your property NIF',
    fields: [
      { id:'address',   label:'Address',          placeholder:'12 Oak Street, Sandton',    type:'text',   half:true },
      { id:'price',     label:'Asking price (R)',  placeholder:'2500000',                   type:'number', half:true },
      { id:'bedrooms',  label:'Bedrooms',          placeholder:'3',                         type:'number', half:true },

      <label style="font-size:11px;color:var(--text3);display:block;margin-bottom:5px;">${f.label}</label>
      <input id="lc-${f.id}" type="${f.type}" placeholder="${f.placeholder}"

    </div>
  `).join('');

  overlay.innerHTML = `
    <div style="background:var(--bg2);border:0.5px solid var(--border2);border-radius:16px;
      width:100%;max-width:620px;max-height:90vh;overflow-y:auto;padding:28px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <div>
          <div style="font-size:15px;font-weight:700">${cfg.title}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${cfg.sub}</div>
        </div>
        <button id="close-aicopy" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
        ${fieldsHTML}
      </div>
      <button id="lc-generate" onclick="executeAICopy('${nifId}','${vertical}')"
        style="width:100%;background:var(--accent);color:#fff;border:none;
          border-radius:9px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;">
        ${cfg.btnLabel}
      </button>
      <div id="lc-output" style="display:none;">
        <div style="height:1px;background:var(--border);margin-bottom:16px;"></div>
        <div id="lc-headline" style="font-size:16px;font-weight:700;margin-bottom:10px;color:var(--accent2)"></div>
        <div id="lc-body" style="font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:14px;white-space:pre-wrap"></div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;">Highlights</div>
        <ul id="lc-highlights" style="list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:16px"></ul>
        <div id="lc-extra-label" style="font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;"></div>
        <div id="lc-extra" style="font-size:12px;color:var(--text3);font-style:italic;margin-bottom:16px;line-height:1.6"></div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;">SEO description</div>
        <div id="lc-seo" style="font-size:12px;color:var(--text3);font-style:italic;margin-bottom:16px;line-height:1.6"></div>
        <button onclick="copyAICopy()"
          style="background:var(--bg3);border:0.5px solid var(--border);color:var(--text2);
            border-radius:7px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;">
          Copy all text
        </button>
      </div>
      <div id="lc-error" style="display:none;color:var(--red);font-size:12px;margin-top:8px;"></div>
    </div>
  `;

  document.body.appendChild(overlay);
  document.getElementById('close-aicopy')?.addEventListener('click', () => document.body.removeChild(overlay));
  overlay.addEventListener('click', e => { if (e.target === overlay) document.body.removeChild(overlay); });
}

async function executeAICopy(nifId, vertical) {
  const cfg = AI_COPY_CONFIG[vertical] ?? AI_COPY_CONFIG.generic;
  const btn = document.getElementById('lc-generate');
  if (btn) { btn.textContent = 'Generating…'; btn.disabled = true; }
  document.getElementById('lc-error').style.display = 'none';

  const body = cfg.buildBody();

  try {
    const res = await api(`/nif/${nifId}/ai-copy`, {
      method: 'POST',
      body: JSON.stringify(body),
    });

    document.getElementById('lc-output').style.display = 'block';
    document.getElementById('lc-headline').textContent = res.headline ?? '';
    document.getElementById('lc-body').textContent     = res.body ?? '';
    document.getElementById('lc-seo').textContent      = res.seoDescription ?? '';

    // Extra field — vertical-specific (conditionSummary, safetyFlags, fitNotes, etc.)
    const extraKey  = Object.keys(res).find(k => !['headline','body','highlights','seoDescription','callToAction'].includes(k));
    const extraEl   = document.getElementById('lc-extra');
    const extraLabel= document.getElementById('lc-extra-label');
    if (extraKey && res[extraKey] && extraEl && extraLabel) {
      extraLabel.textContent = extraKey.replace(/([A-Z])/g,' $1').trim();
      extraEl.textContent    = Array.isArray(res[extraKey]) ? res[extraKey].join(' · ') : res[extraKey];
      extraLabel.style.display = 'block'; extraEl.style.display = 'block';
    }

    const ul = document.getElementById('lc-highlights');
    ul.innerHTML = (res.highlights ?? []).map(h =>
      `<li style="display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--text2)">
        <span style="color:var(--accent2);flex-shrink:0;">✓</span>${h}
      </li>`
    ).join('');

    if (btn) btn.textContent = '✓ Generated';
  } catch (e) {
    document.getElementById('lc-error').style.display = 'block';
    document.getElementById('lc-error').textContent = 'Failed: ' + e.message;
    if (btn) { btn.textContent = cfg.btnLabel; btn.disabled = false; }
  }
}

function copyAICopy() {
  const headline = document.getElementById('lc-headline')?.textContent ?? '';
  const body     = document.getElementById('lc-body')?.textContent ?? '';
  const items    = [...document.querySelectorAll('#lc-highlights li')].map(li => '• ' + li.textContent.replace('✓','').trim()).join('\n');
  const extra    = document.getElementById('lc-extra')?.textContent ?? '';
  const seo      = document.getElementById('lc-seo')?.textContent ?? '';
  const full     = [headline, '', body, '', items, extra ? '\n'+extra : '', '', 'SEO: '+seo].filter(Boolean).join('\n');
  navigator.clipboard.writeText(full).then(() => {
    const btn = document.querySelector('[onclick="copyAICopy()"]');
    if (btn) { btn.textContent = '✓ Copied!'; setTimeout(()=>{ btn.textContent='Copy all text'; },2000); }
  });
}

let selectedVertical = 'generic';
let selectedFile     = null;

window.selectVertical = (id, btn) => {
  selectedVertical = id;
  document.querySelectorAll('[data-vertical]').forEach(b => {
    const active = b.dataset.vertical === id;
    b.style.background   = active ? 'rgba(124,109,250,0.1)' : 'transparent';
    b.style.borderColor  = active ? 'var(--accent)'         : 'var(--border)';
    b.style.color        = active ? 'var(--accent2)'        : 'var(--text2)';
  });
};

window.handleDrop = (e) => {
  e.preventDefault();
  document.getElementById('dropzone').style.borderColor = 'var(--border2)';
  const file = e.dataTransfer?.files?.[0];
  if (file) handleFile(file);
};

window.handleFile = (file) => {
  if (!file) return;
  selectedFile = file;
  window._hasFile = true;

  const dz = document.getElementById('dropzone');
  dz.style.borderColor = 'var(--green)';
  dz.style.cursor      = 'default';
  document.getElementById('dz-content').innerHTML = `
    <div style="font-size:40px;margin-bottom:12px;color:var(--green)">✓</div>
    <div style="font-size:14px;font-weight:700;margin-bottom:4px">${file.name}</div>
    <div style="font-size:12px;color:var(--text2)">${fmtBytes(file.size)}</div>
  `;

  // Show preview
  const pa = document.getElementById('preview-area');
  const pc = document.getElementById('preview-content');
  pa.style.display = 'block';
  document.getElementById('preview-name').textContent = file.name;
  document.getElementById('preview-size').textContent = fmtBytes(file.size);

  if (file.type.startsWith('video/')) {
    pc.innerHTML = `<video src="${URL.createObjectURL(file)}" controls muted playsinline style="width:100%;max-height:300px;display:block;object-fit:cover"></video>`;
    document.getElementById('preview-icon').textContent = '📹';
  } else if (file.type.startsWith('image/')) {
    pc.innerHTML = `<img src="${URL.createObjectURL(file)}" style="width:100%;max-height:300px;object-fit:contain;display:block"/>`;
    document.getElementById('preview-icon').textContent = '📷';
  } else {
    pc.innerHTML = `<div style="padding:32px;text-align:center;font-size:40px;color:var(--text3)">📦</div>`;
    document.getElementById('preview-icon').textContent = '📦';
  }

  document.getElementById('submit-btn').disabled = false;
};

window.clearFile = () => {
  selectedFile = null;
  window._hasFile = false;
  document.getElementById('dz-content').innerHTML = `
    <div style="font-size:48px;margin-bottom:16px;opacity:0.3">↑</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">Drop capture here</div>
    <div style="font-size:12px;color:var(--text2)">or click to browse</div>
  `;
  document.getElementById('dropzone').style.borderColor = 'var(--border2)';
  document.getElementById('dropzone').style.cursor      = 'pointer';
  document.getElementById('preview-area').style.display = 'none';
  document.getElementById('submit-btn').disabled = true;
};

window.resetUpload = () => {
  clearFile();
  document.getElementById('success-area').style.display  = 'none';
  document.getElementById('dropzone').style.display      = 'block';
  document.getElementById('submit-btn').style.display    = 'flex';
};

window.doUpload = async () => {
  if (!selectedFile) return;
  const btn = document.getElementById('submit-btn');
  const progressArea  = document.getElementById('progress-area');
  const successArea   = document.getElementById('success-area');

  btn.disabled = true;
  progressArea.style.display = 'block';
  document.getElementById('dropzone').style.display = 'none';

  function setProgress(pct, label) {
    document.getElementById('progress-bar').style.width  = pct+'%';
    document.getElementById('progress-pct').textContent  = pct+'%';
    document.getElementById('progress-label').textContent = label;
  }

  try {
    setProgress(10, 'Preparing upload…');
    const form = new FormData();
    form.append('capture',     selectedFile);
    form.append('vertical',    selectedVertical);
    form.append('captureMode', document.getElementById('capture-mode').value);
    form.append('title',       document.getElementById('nif-title').value.trim());

    setProgress(30, 'Uploading to secure storage…');
    const res = await fetch(`${API}/capture/upload`, {
      method:  'POST',
      headers: { 'Authorization': `Bearer ${state.token}` },
      body:    form,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    setProgress(100, 'Queued for reconstruction');
    setTimeout(() => {
      progressArea.style.display = 'none';
      successArea.style.display  = 'block';
      btn.style.display = 'none';
      loadAll().then(() => {});
    }, 500);
  } catch(e) {
    setProgress(0, 'Error: ' + e.message);
    document.getElementById('progress-label').style.color = 'var(--red)';
    btn.disabled = false;
  }
};

window.doIssueLicense = async () => {
  const name     = document.getElementById('lic-name')?.value.trim();
  const email    = document.getElementById('lic-email')?.value.trim();
  const domain   = document.getElementById('lic-domain')?.value.trim();
  const plan     = document.getElementById('lic-plan')?.value;
  const fee      = document.getElementById('lic-fee')?.value;
  const currency = document.getElementById('lic-currency')?.value;
  const errEl    = document.getElementById('lic-error');
  const btn      = document.getElementById('lic-submit');

  if (!name || !plan) { errEl.textContent='Client name and plan required'; errEl.style.display='block'; return; }
  btn.disabled=true;
  errEl.style.display='none';

  try {
    await api('/licenses', {
      method: 'POST',
      body:   JSON.stringify({ clientName:name, clientEmail:email, domain, plan, monthlyFee:parseFloat(fee)||0, currency }),
    });
    await loadAll();
    issueFormOpen = false;
    render();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    btn.disabled = false;

function copyDeliveryLink(token) {
  navigator.clipboard.writeText(`https://fumoca.co.za/delivery?t=${token}`).then(() => {
    showToast('Delivery link copied!');
  });
}

async function deleteDelivery(token) {
  if (!confirm('Delete this delivery link? Clients with the link will no longer be able to access it.')) return;
  await api(`/delivery/${token}`, { method:'DELETE' });
  setView('delivery');
}

      <input id="dl-msg" class="input" placeholder="Your 4D captures are ready to explore" style="margin-bottom:12px"/>
      <label style="font-size:11px;color:var(--text3);display:block;margin-bottom:5px">Your name / business</label>

      <label style="font-size:11px;color:var(--text3);display:block;margin-bottom:5px">Expires after</label>
      <select id="dl-expiry" style="width:100%;background:var(--bg3);border:0.5px solid var(--border);color:var(--text);border-radius:7px;padding:8px 12px;font-size:13px;margin-bottom:16px">

      </div>
      <button onclick="createDelivery(this)" style="width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:600;cursor:pointer">
        Create delivery link →
      </button>

async function createDelivery(btn) {
  const overlay = btn.closest('[style*="position:fixed"]');
  const nifIds  = [...overlay.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);
  if (!nifIds.length) { alert('Select at least one NIF'); return; }

  btn.textContent = 'Creating…'; btn.disabled = true;
  try {
    const result = await api('/delivery', {
      method: 'POST',
      body: JSON.stringify({
        nifIds,
        title:       overlay.querySelector('#dl-title').value.trim(),
        message:     overlay.querySelector('#dl-msg').value.trim(),
        brandName:   overlay.querySelector('#dl-brand').value.trim(),
        expiryDays:  +overlay.querySelector('#dl-expiry').value,
      }),
    });
    overlay.remove();
    await navigator.clipboard.writeText(result.url);
    showToast('Delivery link copied to clipboard!');
    setView('delivery');
  } catch(e) {
    btn.textContent = 'Create delivery link →'; btn.disabled = false;
    alert(e.message);
  }
}

// ── Share card + QR code generator ───────────────────────────────────────────
async function openShareCard(nifId) {
  const data = await api(`/nif/${nifId}/share-card`).catch(()=>null);
  if (!data) return;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:16px';

  overlay.innerHTML = `
    <div style="font-size:14px;font-weight:600;color:var(--text2)">Share card preview</div>
    <canvas id="share-canvas" style="border-radius:12px;max-width:100%;max-height:60vh;"></canvas>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button onclick="downloadShareCard('story')" class="btn btn-primary">↓ Story (9:16)</button>
      <button onclick="downloadShareCard('post')"  class="btn btn-primary">↓ Post (1:1)</button>
      <button onclick="downloadShareCard('banner')"class="btn btn-primary">↓ Banner (16:9)</button>
      <button onclick="this.closest('[style*=\"position:fixed\"]').remove()" class="btn btn-ghost">Close</button>
    </div>
  `;
  document.body.appendChild(overlay);

  // Render share card on canvas
  requestAnimationFrame(() => renderShareCard(data, 'story'));
}

function renderShareCard(data, format) {
  const cv  = document.getElementById('share-canvas');
  if (!cv) return;
  const formats = { story:[1080,1920], post:[1080,1080], banner:[1920,1080] };
  const [W,H] = formats[format] || formats.story;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, '#0c0c16');
  grad.addColorStop(1, '#060608');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Violet glow
  const glow = ctx.createRadialGradient(W/2,H*.35,0,W/2,H*.35,W*.6);
  glow.addColorStop(0,'rgba(123,94,248,0.15)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  // Thumbnail
  if (data.thumbnailUrl) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const iH = Math.round(H * .5);
      ctx.save();
      ctx.beginPath();
      const r = 40;
      const ix = W*.1, iy = H*.12, iw = W*.8;
      ctx.moveTo(ix+r,iy); ctx.lineTo(ix+iw-r,iy);
      ctx.quadraticCurveTo(ix+iw,iy,ix+iw,iy+r);
      ctx.lineTo(ix+iw,iy+iH-r); ctx.quadraticCurveTo(ix+iw,iy+iH,ix+iw-r,iy+iH);
      ctx.lineTo(ix+r,iy+iH); ctx.quadraticCurveTo(ix,iy+iH,ix,iy+iH-r);
      ctx.lineTo(ix,iy+r); ctx.quadraticCurveTo(ix,iy,ix+r,iy);
      ctx.closePath(); ctx.clip();
      ctx.drawImage(img, ix, iy, iw, iH);
      ctx.restore();
      drawShareCardText(ctx, data, W, H, iH);
    };
    img.src = data.thumbnailUrl;
  } else {
    drawShareCardText(ctx, data, W, H, 0);
  }

  window._shareCardData = data;
  window._shareCardFormat = format;
}

function drawShareCardText(ctx, data, W, H, imgH) {
  const yBase = H * .12 + imgH + H * .04;

  // ✦ NIF badge
  ctx.fillStyle = 'rgba(123,94,248,0.2)';
  ctx.beginPath();
  const bw=200, bh=44, bx=W/2-bw/2, by=yBase;
  ctx.roundRect(bx,by,bw,bh,22);
  ctx.fill();
  ctx.fillStyle = '#7b5ef8';
  ctx.font = `bold ${Math.round(W*.028)}px 'Instrument Sans',sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('✦  NIF · fumoca.co.za', W/2, by+bh*.66);

  // Title
  ctx.fillStyle = '#f0eff0';
  ctx.font = `bold ${Math.round(W*.06)}px 'Instrument Sans',sans-serif`;
  ctx.textAlign = 'center';
  const title = data.title || 'Explore in 4D';
  ctx.fillText(title.length>24 ? title.slice(0,24)+'…' : title, W/2, yBase+bh+H*.08);

  // CTA
  ctx.fillStyle = 'rgba(46,220,220,0.85)';
  ctx.font = `600 ${Math.round(W*.035)}px 'Instrument Sans',sans-serif`;
  ctx.fillText('Tap to explore in 4D →', W/2, yBase+bh+H*.14);

  // QR code area
  const qrY = yBase+bh+H*.2;
  const qrSize = Math.round(W*.22);
  generateQROnCanvas(ctx, data.viewUrl, W/2-qrSize/2, qrY, qrSize);

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = `${Math.round(W*.022)}px 'Instrument Sans',sans-serif`;
  ctx.fillText('Scan QR or visit fumoca.co.za', W/2, qrY+qrSize+H*.025);
}

function generateQROnCanvas(ctx, url, x, y, size) {
  // Minimal QR placeholder — draws a visible box with the URL domain
  // In production replace with qrcode.js or similar library
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = '#060608';
  ctx.fillRect(x+size*.08, y+size*.08, size*.84, size*.84);
  ctx.fillStyle = '#7b5ef8';
  ctx.font = `bold ${Math.round(size*.12)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('QR', x+size/2, y+size*.55);
  ctx.font = `${Math.round(size*.09)}px monospace`;
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillText('fumoca.co.za', x+size/2, y+size*.72);
}

function downloadShareCard(format) {
  const cv = document.getElementById('share-canvas');
  if (!cv || !window._shareCardData) return;
  renderShareCard(window._shareCardData, format);
  setTimeout(() => {
    const a  = document.createElement('a');
    a.href   = cv.toDataURL('image/jpeg', 0.92);
    a.download = `nif-share-${format}-${Date.now()}.jpg`;
    a.click();
  }, 200);
}

// ── Toast helper ──────────────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;
    background:var(--bg2);border:0.5px solid var(--border2);color:var(--text);
    font-size:13px;font-weight:600;padding:10px 20px;border-radius:100px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:none;
    animation:fadeUp .3s ease;`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
